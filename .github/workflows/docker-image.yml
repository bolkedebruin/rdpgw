name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
         username: ${{ secrets.DOCKER_USER }}
         password: ${{ secrets.DOCKER_PASSWORD }}
      # master is published as latest, a v* tag as that version
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./dev/docker
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ github.repository_owner }}/rdpgw:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/rdpgw
          readme-filepath: ./dev/docker/docker-readme.md
