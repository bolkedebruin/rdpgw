name: Docker Image CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Lowercase owner
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push rdpgw
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw:latest
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw:${{ github.ref_name }}
      - name: Build and push rdpgw-auth-winbind
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile.auth-winbind
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw-auth-winbind:latest
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw-auth-winbind:${{ github.ref_name }}
