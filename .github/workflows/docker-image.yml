name: Docker Image CI
on:
  pull_request:
    branches: [ "master" ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Lowercase owner
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Sanitize tag name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW="${{ github.head_ref }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          echo "TAG_NAME=$(echo "$RAW" | tr '/' '-')" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ] && echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            echo "LATEST_RD=ghcr.io/${{ env.OWNER_LOWER }}/rdpgw:latest" >> "$GITHUB_ENV"
            echo "LATEST_AUTH=ghcr.io/${{ env.OWNER_LOWER }}/rdpgw-auth-winbind:latest" >> "$GITHUB_ENV"
          else
            echo "LATEST_RD=" >> "$GITHUB_ENV"
            echo "LATEST_AUTH=" >> "$GITHUB_ENV"
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push rdpgw
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw:${{ env.TAG_NAME }}
            ${{ env.LATEST_RD }}
      - name: Build and push rdpgw-auth-winbind
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile.auth-winbind
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/rdpgw-auth-winbind:${{ env.TAG_NAME }}
            ${{ env.LATEST_AUTH }}